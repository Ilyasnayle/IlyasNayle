# File: .github/workflows/snake.yml
# 
# SETUP STEPS (do these FIRST or it won't work):
# 1. Go to your profile repo: github.com/ilyasnayle/ilyasnayle
# 2. Go to Settings → Actions → General
# 3. Under "Workflow permissions", select "Read and write permissions"
# 4. Check "Allow GitHub Actions to create and approve pull requests"
# 5. Click Save
# 6. Create this file at: .github/workflows/snake.yml
# 7. Go to Actions tab → "Generate Snake" → "Run workflow" → click the green button
# 8. Wait ~1 minute, then check if the "output" branch was created
# 9. Your snake SVG will be at:
#    https://raw.githubusercontent.com/ilyasnayle/ilyasnayle/output/github-snake.svg
#    https://raw.githubusercontent.com/ilyasnayle/ilyasnayle/output/github-snake-dark.svg

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Runs once every day at midnight
  workflow_dispatch:       # Allows manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ilyasnayle
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
